[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-order-clerk"
version = "0.1.0"
description = "Voice-first 农批开单员业务内核"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
