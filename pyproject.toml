[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-order-clerk"
version = "0.1.0"
description = "Voice-first 农批开单员业务内核"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
