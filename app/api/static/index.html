<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>今日开单</title>
  <style>
    :root {
      --bg: #0f1410;
      --panel: #1a221c;
      --ink: #f3f0e6;
      --muted: #9aa394;
      --accent: #3dcc7a;
      --accent-ink: #062012;
      --warn: #e7c36a;
      --line: #2c382f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #1c3a28 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      padding: 20px 20px 300px;
    }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h1 { font-size: 28px; margin: 0; }
    .date { color: var(--muted); font-size: 16px; }
    .counts { margin-top: 8px; font-size: 16px; color: var(--muted); }
    .counts strong { color: var(--ink); font-weight: 650; }
    .phase {
      display: inline-block;
      margin: 18px 0 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #243028;
      color: var(--muted);
      font-size: 13px;
    }
    .guide {
      color: var(--muted);
      font-size: 16px;
      margin: 0 0 12px;
      min-height: 24px;
    }
    .speak {
      min-height: 88px;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 650;
      white-space: pre-line;
    }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
    body[data-ui="DONE"] .examples { display: none; }
    .chip {
      border: 1px solid var(--line);
      background: #162019;
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }
    .card {
      margin-top: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
    }
    .status {
      display: inline-block;
      margin-bottom: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      background: #3a2f12;
      color: var(--warn);
    }
    .status.ok { background: #163224; color: var(--accent); }
    .facts { display: grid; grid-template-columns: 64px 1fr; gap: 8px 12px; font-size: 18px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; font-weight: 650; }
    .empty { color: var(--muted); }
    .book-item {
      padding: 12px 0;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 16px;
    }
    .book-item:first-of-type { border-top: 0; padding-top: 0; }
    .meta { color: var(--muted); }
    .price-tbd { color: var(--warn); }
    .dev {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }
    body.dev-on .dev { display: block; }
    .dev h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.1em; }
    .event { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .dock {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #0f1410 70%, transparent);
    }
    .dock-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .mic {
      width: 196px;
      height: 196px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(61, 204, 122, 0.28);
      touch-action: none;
      user-select: none;
      line-height: 1.25;
      padding: 16px;
    }
    body[data-ui="LISTENING"] .mic { background: #f3f0e6; }
    body[data-ui="PROCESSING"] .mic { opacity: 0.7; }
    body[data-ui="DONE"] .mic { background: var(--warn); }
    .done-btn {
      min-width: 196px;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #162019;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .done-btn:disabled { opacity: 0.4; cursor: default; }
    .hint { color: var(--muted); font-size: 13px; }
    .sheet {
      display: none;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }
    body[data-ui="LISTENING"] .sheet { display: block; }
    textarea {
      width: 100%;
      min-height: 72px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 22px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
  </style>
</head>
<body data-ui="IDLE">
  <div class="wrap">
    <header>
      <div class="head">
        <h1>今日开单</h1>
        <div class="date" id="bizDate"></div>
      </div>
      <div class="counts" id="counts">今天 <strong>0</strong> 张 · 待确认 <strong>0</strong> · 已确认 <strong>0</strong></div>
    </header>

    <div class="phase" id="phase">按住说话</div>
    <p class="guide" id="guide">先说开谁的单。按住说话，或点下面的例子。</p>
    <div class="speak" id="reply">按住说话开始开单。</div>
    <div class="examples" id="examples">
      <button class="chip" type="button" data-example="李老板苹果八十果二十箱">李老板苹果八十果二十箱</button>
      <button class="chip" type="button" data-example="刚才苹果改30箱">刚才苹果改30箱</button>
      <button class="chip" type="button" data-example="好了">好了</button>
    </div>

    <section class="card" id="currentCard">
      <h2>当前订单</h2>
      <div id="orderBox" class="empty">还没有开始开单</div>
    </section>

    <section class="card">
      <h2>待确认</h2>
      <div id="pendingBox" class="empty">没有待确认</div>
    </section>

    <section class="card">
      <h2>已确认</h2>
      <div id="confirmedBox" class="empty">还没有已确认</div>
    </section>

    <section class="dev" id="devPanel">
      <h2>业务时间线</h2>
      <div id="timeline" class="empty">暂无事件</div>
      <h2 style="margin-top:14px;">session</h2>
      <div id="sessionMeta" class="empty">未创建</div>
    </section>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <div class="sheet">
        <textarea id="speech" placeholder="正在听…"></textarea>
      </div>
      <button class="mic" id="mic" type="button">🎤<br>按住说话</button>
      <button class="done-btn" id="done" type="button">好了</button>
      <div class="hint">也可以直接说「好了」。听错的字不会被改成商品。</div>
    </div>
  </div>

  <script src="/static/voice-controller.js"></script>
  <script>
    const phaseLabel = {
      IDLE: "按住说话",
      LISTENING: "正在听...",
      PROCESSING: "正在整理...",
      SPEAKING: "按住说话",
      DONE: "单已经定了",
    };

    const micLabel = {
      IDLE: "🎤\n按住说话",
      LISTENING: "正在听...",
      PROCESSING: "正在整理...",
      SPEAKING: "🎤\n按住说话",
      DONE: "再开一单",
    };

    const POSTING = { pending: "排队中", posted: "已进草稿", unavailable: "看不见" };

    if (new URLSearchParams(location.search).get("dev") === "1") {
      document.body.classList.add("dev-on");
    }

    const speech = document.getElementById("speech");
    let asrFinal = "";
    let book = { business_date: "", current_session_id: null, tasks: [] };

    function mapDemoUtterance(text) {
      const t = String(text || "").replace(/\s+/g, "").trim();
      if (t === "李老板苹果八十果二十箱") return "开李老板的单苹果二十箱";
      if (t === "刚才苹果改30箱" || t === "刚才那个苹果改30箱") return "苹果改30箱";
      return String(text || "").trim();
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, function (ch) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
      });
    }

    function bossName(customer) {
      if (!customer) return "";
      const aliases = customer.aliases || [];
      if (aliases.length) return aliases[0];
      return customer.name || "";
    }

    function lineFacts(line) {
      const label = line.label || "";
      let product = label;
      if (label.indexOf("梨") >= 0) product = "梨";
      else if (label.indexOf("榴莲") >= 0) product = "榴莲";
      else if (label.indexOf("苹果") >= 0 || label.indexOf("富士") >= 0) product = "苹果";
      let spec = "";
      const matched = label.match(/(\d+\s*果|八十果|八零果)/);
      if (matched) spec = matched[1].replace(/\s+/g, "");
      if (spec === "八十果" || spec === "八零果") spec = "80果";
      return { product: product, spec: spec, qty: String(line.qty || "") + String(line.uom || "") };
    }

    function formatDate(iso) {
      if (!iso) return "";
      const parts = String(iso).split("-");
      if (parts.length < 3) return iso;
      return Number(parts[1]) + "月" + Number(parts[2]) + "日";
    }

    function postingText(value) {
      return POSTING[value] || "";
    }

    function taskHasWork(task) {
      return Boolean(task && (task.status === "confirmed" || task.customer_label || task.line_count));
    }

    function setPhase(phase) {
      document.body.dataset.ui = phase;
      document.getElementById("phase").textContent = phaseLabel[phase];
      document.getElementById("mic").textContent = micLabel[phase];
      document.getElementById("done").disabled = phase === "PROCESSING" || phase === "DONE";
      if (phase === "LISTENING") {
        if (!speech.value) speech.value = "";
        setTimeout(function () { speech.focus(); }, 30);
      }
    }

    function renderGuide(draft) {
      const el = document.getElementById("guide");
      if (controller.state.hint) {
        el.textContent = controller.state.hint;
        return;
      }
      if (!draft || !draft.customer) {
        el.textContent = "先说开谁的单。按住说话，或点下面的例子。";
        return;
      }
      if (draft.status === "confirmed") {
        el.textContent = "这张已经定了。";
        return;
      }
      if (!draft.lines || !draft.lines.length) {
        el.textContent = "直接报货就行。";
        return;
      }
      el.textContent = "说「好了」，这单就定。";
    }

    function renderOrder(draft) {
      const box = document.getElementById("orderBox");
      if (!draft || !draft.customer) {
        box.className = "empty";
        box.textContent = "还没有开始开单";
        return;
      }
      const confirmed = draft.status === "confirmed";
      const line = (draft.lines && draft.lines[0]) || null;
      const facts = line ? lineFacts(line) : { product: "", spec: "", qty: "" };
      const tbd = line && (line.price_status === "tbd" || !line.unit_price);
      box.className = "";
      box.innerHTML =
        "<div class=\"status " + (confirmed ? "ok" : "") + "\">" + (confirmed ? "已确认" : "待确认") + "</div>" +
        "<dl class=\"facts\">" +
        "<dt>客户</dt><dd>" + esc(bossName(draft.customer)) + "</dd>" +
        "<dt>商品</dt><dd>" + esc(facts.product || "还没有货") + "</dd>" +
        "<dt>规格</dt><dd>" + esc(facts.spec || "—") + "</dd>" +
        "<dt>数量</dt><dd>" + esc(facts.qty || "—") + "</dd>" +
        "<dt>价格</dt><dd class=\"" + (tbd ? "price-tbd" : "") + "\">" + (tbd ? "价未定" : esc(line && line.unit_price)) + "</dd>" +
        "</dl>";
    }

    function renderBook() {
      document.getElementById("bizDate").textContent = formatDate(book.business_date);
      const tasks = book.tasks || [];
      const currentId = book.current_session_id;
      const working = tasks.filter(taskHasWork);
      const pending = working.filter(function (task) { return task.status !== "confirmed"; });
      const confirmed = working.filter(function (task) { return task.status === "confirmed"; });
      document.getElementById("counts").innerHTML =
        "今天 <strong>" + working.length + "</strong> 张 · 待确认 <strong>" + pending.length + "</strong> · 已确认 <strong>" + confirmed.length + "</strong>";

      function row(task) {
        const posting = task.status === "confirmed" ? postingText(task.posting) : "待确认";
        const extra = task.prices_incomplete ? " · 价未定" : "";
        return "<div class=\"book-item\"><div>" + esc(task.customer_label || "未开客户") +
          " · " + (task.line_count || 0) + "行</div><div class=\"meta\">" + esc(posting) + extra + "</div></div>";
      }

      const pendingShow = pending.filter(function (task) { return task.session_id !== currentId || task.status !== "confirmed"; });
      const pendingBox = document.getElementById("pendingBox");
      if (!pendingShow.length) {
        pendingBox.className = "empty";
        pendingBox.textContent = "没有待确认";
      } else {
        pendingBox.className = "";
        pendingBox.innerHTML = pendingShow.map(row).join("");
      }

      const confirmedBox = document.getElementById("confirmedBox");
      if (!confirmed.length) {
        confirmedBox.className = "empty";
        confirmedBox.textContent = "还没有已确认";
      } else {
        confirmedBox.className = "";
        confirmedBox.innerHTML = confirmed.map(row).join("");
      }
    }

    function renderDev(body) {
      const items = (body && body.timeline) || [];
      const timeline = document.getElementById("timeline");
      if (!items.length) {
        timeline.className = "empty";
        timeline.textContent = "暂无事件";
      } else {
        timeline.className = "";
        timeline.innerHTML = items.map(function (ev) { return "<div class=\"event\">" + esc(ev.event_type) + "</div>"; }).join("");
      }
      document.getElementById("sessionMeta").textContent = controller.state.sessionId
        ? ("session_id " + controller.state.sessionId)
        : "未创建";
    }

    function showReply(text) {
      document.getElementById("reply").textContent = text || "";
    }

    async function refreshBook() {
      try {
        const res = await fetch("/v1/workbench");
        book = await res.json();
      } catch (err) {
        return;
      }
      renderBook();
    }

    function renderFromState() {
      const state = controller.state;
      setPhase(state.phase);
      const body = state.last || {};
      const draft = body.draft;
      const spoken = state.replyText || (body && body.reply_text) || "";
      if (spoken) {
        showReply(spoken);
      } else if (!draft || !draft.customer) {
        showReply("按住说话开始开单。");
      } else {
        showReply("");
      }
      renderOrder(draft);
      renderGuide(draft);
      renderDev(body);
      renderBook();
      refreshBook();
      if (state.phase === "LISTENING" && state.overlay) {
        speech.value = state.overlay;
      }
    }

    const transport = {
      createSession: async function () {
        const res = await fetch("/v1/sessions", { method: "POST" });
        return res.json();
      },
      postTurn: async function (sessionId, command) {
        const mapped = Object.assign({}, command, { text: mapDemoUtterance(command.text) });
        const res = await fetch("/v1/sessions/" + sessionId + "/turns", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(mapped)
        });
        const body = await res.json();
        return { status: res.status, body: body };
      }
    };

    const tts = VoiceShell.createBrowserTts(
      function (playId) { controller.onTtsEnded(playId); },
      function () { controller.onTtsInterrupted(); }
    );

    const controller = VoiceShell.createVoiceController({
      transport: transport,
      tts: tts,
      onChange: renderFromState
    });

    const rec = VoiceShell.createBrowserAsr(
      function (partial) { controller.notePartial(partial); },
      function (finalText) { asrFinal = finalText; }
    );

    async function startListen() {
      const result = controller.press();
      if (result.startNew) {
        showReply("按住说话开始开单。");
        await controller.startNewSession();
        return;
      }
      if (result.reason !== "listening") return;
      asrFinal = "";
      speech.value = "";
      if (rec) {
        try { rec.start(); } catch (err) {}
      }
    }

    async function endListen() {
      if (controller.state.phase !== "LISTENING" || !controller.state.hold) return;
      if (rec) {
        try { rec.stop(); } catch (err) {}
      }
      const said = asrFinal || speech.value;
      asrFinal = "";
      await controller.releaseFinal(said);
      speech.value = "";
    }

    const mic = document.getElementById("mic");
    mic.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      startListen();
    });
    mic.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
    window.addEventListener("pointerup", endListen);
    window.addEventListener("pointercancel", endListen);

    speech.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        endListen();
      }
    });

    document.getElementById("done").addEventListener("click", function () {
      controller.confirmDone();
    });

    document.getElementById("examples").addEventListener("click", function (ev) {
      const chip = ev.target.closest("[data-example]");
      if (!chip) return;
      controller.submitFakeFinal(chip.getAttribute("data-example"));
    });

    showReply("按住说话开始开单。");
    controller.startNewSession();
  </script>
</body>
</html>
